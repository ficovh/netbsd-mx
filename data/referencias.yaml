# Referencias curadas del proyecto NetBSD.
# Para agregar un enlace, añade un elemento a la lista "enlaces" del grupo
# correspondiente. Los campos son obligatorios.

- grupo: "El proyecto"
  descripcion: "El sitio oficial, sus noticias y la fundación que sostiene el proyecto."
  enlaces:
    - nombre: "Sitio oficial"
      url: "https://www.netbsd.org/"
      etiqueta: "netbsd.org"
      descripcion: "Noticias, descargas, documentación y todo lo que publica el proyecto."
    - nombre: "Blog oficial de NetBSD"
      url: "https://blog.netbsd.org/"
      etiqueta: "blog.netbsd.org"
      descripcion: "Anuncios de versiones, notas de desarrollo y artículos de la comunidad internacional."
    - nombre: "The NetBSD Foundation"
      url: "https://www.netbsd.org/foundation/"
      etiqueta: "fundación"
      descripcion: "La organización sin fines de lucro que administra el proyecto y su propiedad intelectual."
    - nombre: "Versiones y notas de lanzamiento"
      url: "https://www.netbsd.org/releases/"
      etiqueta: "releases"
      descripcion: "Historial de versiones, notas de cada lanzamiento e instrucciones de actualización."
    - nombre: "Donaciones"
      url: "https://www.netbsd.org/donations/"
      etiqueta: "apoya"
      descripcion: "Financia hardware de compilación, infraestructura y desarrollo del proyecto."

- grupo: "Documentación"
  descripcion: "Guías, manuales y la wiki para instalar, configurar y administrar el sistema."
  enlaces:
    - nombre: "La Guía de NetBSD"
      url: "https://www.netbsd.org/docs/guide/en/"
      etiqueta: "guía"
      descripcion: "El manual de referencia: instalación, red, paquetes, servicios y administración."
    - nombre: "Documentación oficial"
      url: "https://www.netbsd.org/docs/"
      etiqueta: "docs"
      descripcion: "Índice general de guías, HOWTOs, libros y documentación del proyecto."
    - nombre: "Páginas de manual"
      url: "https://man.netbsd.org/"
      etiqueta: "man"
      descripcion: "Consulta en línea de todas las secciones del manual del sistema."
    - nombre: "Wiki de NetBSD"
      url: "https://wiki.netbsd.org/"
      etiqueta: "wiki"
      descripcion: "Notas comunitarias, recetas y documentación en evolución."
    - nombre: "Ports: plataformas soportadas"
      url: "https://www.netbsd.org/ports/"
      etiqueta: "ports"
      descripcion: "Lista completa de arquitecturas y equipos, con notas específicas de cada port."
    - nombre: "Avisos de seguridad"
      url: "https://www.netbsd.org/security/"
      etiqueta: "security"
      descripcion: "Boletines, parches y el proceso de respuesta del equipo de seguridad."

- grupo: "Paquetes y software"
  descripcion: "pkgsrc, el sistema de paquetes portable, y sus repositorios binarios."
  enlaces:
    - nombre: "pkgsrc"
      url: "https://www.pkgsrc.org/"
      etiqueta: "pkgsrc"
      descripcion: "El sistema de paquetes que funciona en NetBSD y en otros sistemas Unix."
    - nombre: "Guía de pkgsrc"
      url: "https://www.netbsd.org/docs/pkgsrc/"
      etiqueta: "manual"
      descripcion: "Cómo instalar, compilar, configurar y crear paquetes con pkgsrc."
    - nombre: "Buscar paquetes"
      url: "https://pkgsrc.se/"
      etiqueta: "pkgsrc.se"
      descripcion: "Buscador web de paquetes, versiones y dependencias de pkgsrc."
    - nombre: "Repositorio binario"
      url: "https://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/"
      etiqueta: "binarios"
      descripcion: "Paquetes ya compilados por plataforma y versión de NetBSD."
    - nombre: "Código de pkgsrc en GitHub"
      url: "https://github.com/NetBSD/pkgsrc"
      etiqueta: "github"
      descripcion: "Espejo del árbol de pkgsrc para consultar cambios y proponer mejoras."

- grupo: "Código y desarrollo"
  descripcion: "Fuentes, seguimiento de errores y herramientas para contribuir al proyecto."
  enlaces:
    - nombre: "Código fuente en GitHub"
      url: "https://github.com/NetBSD/src"
      etiqueta: "github"
      descripcion: "Espejo oficial del árbol de código fuente de NetBSD."
    - nombre: "CVSWeb"
      url: "https://cvsweb.netbsd.org/"
      etiqueta: "cvs"
      descripcion: "Navega el historial de cambios del repositorio original del proyecto."
    - nombre: "Cross-reference"
      url: "https://nxr.netbsd.org/"
      etiqueta: "nxr"
      descripcion: "Explorador de código con referencias cruzadas entre archivos y símbolos."
    - nombre: "Seguimiento de errores (GNATS)"
      url: "https://gnats.netbsd.org/"
      etiqueta: "gnats"
      descripcion: "Base de datos pública de errores, parches y solicitudes."
    - nombre: "Cómo contribuir"
      url: "https://www.netbsd.org/contrib/"
      etiqueta: "contrib"
      descripcion: "Guía oficial para enviar parches, documentación, pruebas y paquetes."

- grupo: "Comunidad y soporte"
  descripcion: "Canales oficiales para preguntar, aprender y estar al día."
  enlaces:
    - nombre: "Listas de correo"
      url: "https://www.netbsd.org/mailinglists/"
      etiqueta: "listas"
      descripcion: "El canal principal de soporte y desarrollo, con archivos públicos."
    - nombre: "Comunidad"
      url: "https://www.netbsd.org/community/"
      etiqueta: "community"
      descripcion: "Puntos de encuentro, recursos regionales y formas de participar."
    - nombre: "IRC en Libera.Chat"
      url: "https://web.libera.chat/#netbsd"
      etiqueta: "#netbsd"
      descripcion: "Canal de conversación en tiempo real; también puedes usar tu cliente IRC."
    - nombre: "Galería de equipos"
      url: "https://www.netbsd.org/gallery/"
      etiqueta: "hardware"
      descripcion: "Máquinas reales corriendo NetBSD, desde servidores hasta consolas."
