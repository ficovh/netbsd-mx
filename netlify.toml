# Despliegue en Netlify para netbsd.org.mx
# Sitio estático generado con Hugo (tema propio, sin dependencias externas).

[build]
  # DEPLOY_PRIME_URL lo define Netlify en cada compilación: la URL de producción
  # en main y una URL única en deploy previews / branch deploys. El valor de
  # respaldo solo se usa al compilar fuera de Netlify.
  command = "hugo --minify --gc --baseURL \"${DEPLOY_PRIME_URL:-https://www.netbsd.org.mx}/\""
  publish = "public"

[build.environment]
  # Misma versión que usa .github/workflows/ (Hugo extended).
  HUGO_VERSION = "0.168.0"
  HUGO_ENVIRONMENT = "production"
  HUGO_ENABLEGITINFO = "true"
  TZ = "America/Mexico_City"

# El dominio sin www redirige al canónico. Requiere que netbsd.org.mx esté
# agregado como dominio en Netlify; si no lo usas, elimina este bloque.
[[redirects]]
  from = "https://netbsd.org.mx/*"
  to = "https://www.netbsd.org.mx/:splat"
  status = 301
  force = true

# Cabeceras de seguridad para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# CSS y JS llevan huella digital en el nombre (fingerprint de Hugo),
# así que se pueden cachear de forma indefinida.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes y tipografías: caché de una semana (el nombre no cambia al editarlas).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Las páginas HTML siempre se revalidan para reflejar contenido nuevo.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
